name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build, unit tests and lint
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Save APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nhip-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14
